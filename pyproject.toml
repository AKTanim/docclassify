[project]
name = "docclassify"
version = "0.1.0"
description = "Classifies construction documents using Lambda."
readme = "README.md"
authors = [
    { name = "Tanim", email = "tanim.akt@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.3",
    "pypdf>=7.0.0",
]


[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

# Report lines longer than 100 characters
[tool.ruff]
line-length = 100

# ruff rule groups: E style, F errors, I import order
# B bug pattern, UP syntax, S security
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

# Allow assert rules for tests, rule S101
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# pytest - look for tests
[tool.pytest.ini_options]
testpaths = ["tests"]
